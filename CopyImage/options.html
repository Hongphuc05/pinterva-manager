<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình Tacahu Gallery Bridge</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .title-group h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .title-group p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #334155;
            color: #fff;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .status-badge {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: none;
            margin-top: 10px;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: block;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-badge" style="font-size: 16px; font-weight: bold;">POD</div>
            <div class="title-group">
                <h1>Tacahu POD - Printerval Sync</h1>
                <p>Cấu hình kết nối & Tốc độ quét</p>
            </div>
        </div>

        <div class="form-group">
            <label for="apiBaseUrl">Tacahu Ops API URL</label>
            <div class="input-row">
                <input type="text" id="apiBaseUrl" placeholder="https://tacahu.fun hoặc http://localhost:8000" />
                <button type="button" id="btnTest" class="btn btn-secondary">Kiểm tra</button>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 8px;">
                <button type="button" id="btnPresetProd" class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;">🌐 VPS: https://tacahu.fun</button>
                <button type="button" id="btnPresetLocal" class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;">💻 Local: http://localhost:8000</button>
            </div>
            <p class="hint">Địa chỉ Web/API Tacahu Ops. Khi dùng trên VPS thì chọn <strong>https://tacahu.fun</strong> (hoặc domain VPS của bạn).</p>
            <div id="testStatus" class="status-badge"></div>
        </div>

        <div class="form-group">
            <label for="maxConcurrency">Số luồng quét đồng thời (Concurrency)</label>
            <select id="maxConcurrency">
                <option value="3">3 luồng (Nhẹ nhàng)</option>
                <option value="5" selected>5 luồng (Khuyến nghị)</option>
                <option value="8">8 luồng (Nhanh)</option>
                <option value="10">10 luồng (Tốc độ tối đa)</option>
            </select>
            <p class="hint">Tăng số luồng giúp quét 50 đơn chỉ trong vài giây.</p>
        </div>

        <div class="form-group">
            <label class="checkbox-group">
                <input type="checkbox" id="autoScanOnLoad">
                <span>Tự động quét bộ ảnh ngay khi mở trang Design Job</span>
            </label>
        </div>

        <button type="button" id="btnSave" class="btn btn-primary">Lưu Cấu Hình</button>
        <div id="saveStatus" class="status-badge"></div>

        <div class="footer">
            <span>Version 15.0 (Manifest V3)</span>
            <span>Tacahu POD Engineering</span>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
