<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Duyệt kết quả kiểm tra trùng</title>
<style>
  :root { --bg:#0f1117; --panel:#171a22; --border:#262a35; --text:#e6e8ee; --muted:#9aa1b1;
          --accent:#5b8def; --ok:#3fb27f; --warn:#e0a13a; --bad:#e5606b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  select, button { font:inherit; border-radius:8px; border:1px solid var(--border); padding:7px 12px;
                   background:#1f2330; color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { background:transparent; border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stats { color:var(--muted); font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
          padding:14px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:15px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .code { font-family:ui-monospace,Menlo,monospace; background:#20263a; padding:2px 8px; border-radius:6px; }
  .name { color:var(--muted); font-weight:400; font-size:13px; }
  .row { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .fig { width:190px; }
  .fig img { width:190px; height:190px; object-fit:contain; background:#0b0d12;
             border:1px solid var(--border); border-radius:8px; display:block; }
  .fig.chosen img { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); }
  .fig .cap { font-size:12px; margin-top:6px; line-height:1.5; }
  .fig .cap b { font-family:ui-monospace,Menlo,monospace; }
  .muted { color:var(--muted); }
  .sep { width:1px; align-self:stretch; background:var(--border); }
  .cands { display:flex; gap:12px; flex-wrap:wrap; flex:1; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); }
  .badge.trung { color:var(--warn); border-color:var(--warn); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.bad { color:var(--bad); border-color:var(--bad); }
  .actions { margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .msg { color:var(--muted); font-size:13px; padding:20px 0; }
  .err { color:var(--bad); }
</style>
</head>
<body>
  <h1>Duyệt kết quả kiểm tra trùng</h1>
  <div class="sub">Mỗi ảnh đều kèm mã đơn. Chọn ảnh model gợi ý mà bạn thấy thật sự trùng để gửi Telegram xác nhận;
    nếu model sai, bấm "Model sai". Đơn "Model sai" và đơn không thấy trùng vẫn ở tab Chưa kiểm tra cho tới khi bạn gõ /handle.</div>

  <div class="bar">
    <label>Job: <select id="job"></select></label>
    <button id="reload">Tải lại</button>
    <span class="stats" id="stats"></span>
  </div>
  <div class="bar tabs" id="tabs">
    <button data-tab="todo" class="active">Cần duyệt</button>
    <button data-tab="done">Đã duyệt</button>
    <button data-tab="nomatch">Không thấy trùng</button>
  </div>
  <div id="list"><div class="msg">Đang tải…</div></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { tab: "todo", jobs: [], items: [], job: null };
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "");

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return res.json();
}

function jobLabel(j) {
  const when = j.created_at ? new Date(j.created_at).toLocaleString("vi-VN") : "";
  return `${when} · ${j.status} · ${j.processed_count}/${j.requested_count} đơn · ${j.duplicate_count} nghi trùng`;
}

async function loadJobs() {
  const { jobs } = await api("/review/jobs");
  state.jobs = jobs;
  $("job").innerHTML = jobs.map((j) => `<option value="${esc(j.id)}">${esc(jobLabel(j))}</option>`).join("");
  if (!jobs.length) { $("list").innerHTML = '<div class="msg">Chưa có job nào.</div>'; return; }
  await loadJob();
}

async function loadJob() {
  const id = $("job").value;
  if (!id) return;
  $("list").innerHTML = '<div class="msg">Đang tải…</div>';
  try {
    const data = await api(`/review/jobs/${id}`);
    state.job = data.job; state.items = data.items;
    render();
  } catch (e) { $("list").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

const isTodo = (i) => i.review_status === "pending_review";
const isDone = (i) => i.review_status === "selected_duplicate" || i.review_status === "ai_wrong";
const isNoMatch = (i) => i.review_status === "no_match";

function figure(img, code, name, extra, chosen) {
  const src = safeUrl(img);
  return `<div class="fig${chosen ? " chosen" : ""}">
    ${src ? `<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" loading="lazy" alt="${esc(code)}"></a>` : '<div class="muted">Không có ảnh</div>'}
    <div class="cap">Mã đơn <b>${esc(code)}</b>${name ? `<div class="muted">${esc(name)}</div>` : ""}${extra || ""}</div></div>`;
}

function candidateHtml(item, c, canAct) {
  const chosen = item.selected_candidate_id === c.id;
  const extra = `<div>#${c.rank} · sim ${c.similarity.toFixed(3)}
      <span class="badge ${c.classification === "TRUNG" ? "trung" : ""}">${esc(c.classification)}</span></div>
    <div class="muted">pHash ${c.phash_distance ?? "-"} · SSIM ${c.ssim == null ? "-" : c.ssim.toFixed(2)}</div>
    ${chosen ? `<div class="badge ok">${c.sent_to_telegram ? "Đã gửi Telegram" : "Đã chọn · chờ gửi Telegram (≤60s)"}</div>` : ""}
    ${canAct && !c.sent_to_telegram ? `<div class="actions"><button class="primary" data-act="select" data-item="${esc(item.id)}" data-cand="${esc(c.id)}">Chọn ảnh này là trùng</button></div>` : ""}`;
  return figure(c.image_url, c.order_code || "không rõ", c.product_name, extra, chosen);
}

function itemHtml(item) {
  const sent = item.candidates.some((c) => c.id === item.selected_candidate_id && c.sent_to_telegram);
  const canAct = !sent && (isTodo(item) || isDone(item));
  const status = item.review_status === "ai_wrong" ? '<span class="badge bad">Model sai</span>'
    : item.review_status === "selected_duplicate" ? '<span class="badge ok">Đã chọn</span>'
    : item.review_status === "no_match" ? '<span class="badge">Không thấy trùng</span>' : "";
  return `<div class="card" data-item="${esc(item.id)}">
    <h3><span class="code">${esc(item.order_code)}</span><span class="name">${esc(item.product_name || "")}</span>${status}</h3>
    <div class="row">
      ${figure(item.image_url, item.order_code, "", '<div class="badge">Ảnh gốc</div>', false)}
      <div class="sep"></div>
      <div class="cands">${item.candidates.map((c) => candidateHtml(item, c, canAct)).join("") || '<div class="muted">Không có candidate</div>'}</div>
    </div>
    ${canAct ? `<div class="actions"><button class="danger" data-act="reject" data-item="${esc(item.id)}">Model sai — bỏ qua đơn ${esc(item.order_code)}</button></div>` : ""}
  </div>`;
}

function render() {
  const groups = { todo: state.items.filter(isTodo), done: state.items.filter(isDone), nomatch: state.items.filter(isNoMatch) };
  document.querySelectorAll("#tabs button").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === state.tab);
    b.textContent = { todo: "Cần duyệt", done: "Đã duyệt", nomatch: "Không thấy trùng" }[b.dataset.tab] + ` (${groups[b.dataset.tab].length})`;
  });
  const j = state.job;
  $("stats").textContent = `Job ${j.status}: ${j.processed_count}/${j.requested_count} đơn đã so · ${j.duplicate_count} nghi trùng · ${j.error_count} lỗi`;
  const list = groups[state.tab];
  $("list").innerHTML = list.length ? list.map(itemHtml).join("") : '<div class="msg">Không có đơn nào trong mục này.</div>';
}

document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  btn.disabled = true;
  try {
    if (btn.dataset.act === "select") {
      await api(`/review/items/${btn.dataset.item}/select`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ candidate_id: btn.dataset.cand }),
      });
    } else {
      await api(`/review/items/${btn.dataset.item}/reject`, { method: "POST" });
    }
    await loadJob();
  } catch (e) { alert(e.message); btn.disabled = false; }
});
$("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { state.tab = b.dataset.tab; render(); } });
$("job").addEventListener("change", loadJob);
$("reload").addEventListener("click", loadJobs);
loadJobs().catch((e) => { $("list").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; });
</script>
</body>
</html>
