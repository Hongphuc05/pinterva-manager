<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Duplicate Design Scan — Pool</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a22; --border: #262a35;
    --text: #e6e8ee; --muted: #9aa1b1; --accent: #5b8def; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); padding: 24px; }
  a { color: var(--accent); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 16px; max-width: 1100px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: white; border: none; border-radius: 8px;
           padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button.danger { background: #3a1c1c; color: var(--danger); border: 1px solid var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .badge.TRUNG { background: #4a1620; color: #ff8fa3; }
  .badge.KHONG_TRUNG { background: #16351f; color: #7fe0a0; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #12141c; }
  .card-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .card-head img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .card-head .name { font-size: 13px; }
  .card-head .verdict { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); }
  .matches { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: none; }
  .matches.open { display: block; }
  .match-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12px; }
  .match-row img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); }
  .match-row .grow { flex: 1; }
  .skipped { color: var(--muted); font-size: 12px; font-style: italic; }
  .src-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px;
               font-weight: 600; margin: 0 6px; vertical-align: middle; }
  .src-badge.src-old { background: #1c2a4a; color: #7fb0ff; }
  .src-badge.src-new { background: #3a2a1c; color: #ffb066; }
  .warn { background: #4a3416; color: #ffb066; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .toggle-hint { font-size: 11px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
  <div class="row" style="margin-bottom:6px;">
    <h1>Duplicate Design — Quét pool (old/new)</h1>
  </div>
  <div class="sub">
    Luồng "pool tăng dần": ảnh trong <code>data/old/</code> là kho gốc, ảnh trong
    <code>data/new/</code> được quét TUẦN TỰ, từng ảnh so với toàn bộ pool hiện có
    rồi tự thêm vào pool cho ảnh kế tiếp. Xem công cụ so 1-1 tại
    <a href="/index.html">trang so sánh thủ công</a>.
  </div>

  <div id="warn-slot"></div>

  <div class="panel">
    <div class="row">
      <button id="btn-ingest">1. Ingest kho ảnh cũ (data/old)</button>
      <button id="btn-scan">2. Quét ảnh mới tuần tự (data/new)</button>
      <button id="btn-reset" class="danger">Reset DB (xoá hết, test lại từ đầu)</button>
      <button id="btn-refresh-stats" style="background:#2a2d3a;">Làm mới trạng thái</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <span class="stat" id="stat-pool">Đang tải trạng thái pool...</span>
    </div>
    <div class="row" style="margin-top:6px;">
      <span class="stat" id="status-line"></span>
    </div>
  </div>

  <div id="ingest-result"></div>
  <div id="scan-results"></div>

  <script>
    async function refreshStats() {
      const res = await fetch("/admin/pool");
      const data = await res.json();
      const el = document.getElementById("stat-pool");
      el.innerHTML = `Pool hiện tại: <b>${data.pool_stats.old || 0}</b> ảnh old, ` +
                      `<b>${data.pool_stats.new || 0}</b> ảnh new đã xử lý ` +
                      `(model: <b>${data.current_model_version}</b>)`;

      const warnSlot = document.getElementById("warn-slot");
      if (data.images_with_other_model_version > 0) {
        warnSlot.innerHTML = `<div class="warn">
          ⚠️ Có ${data.images_with_other_model_version} ảnh trong DB thuộc model_version khác
          model hiện tại — các ảnh đó KHÔNG được đưa vào pool so sánh (embedding không cùng
          không gian vector). Nếu vừa đổi model, cần Reset DB rồi ingest lại toàn bộ.
        </div>`;
      } else {
        warnSlot.innerHTML = "";
      }

      const isFallback = (data.current_model_version || "").toLowerCase().includes("fallback");
      if (isFallback) {
        warnSlot.innerHTML += `<div class="warn">
          ⚠️ Đang chạy embedding fallback cổ điển (không phải DINOv2/DINOv3 khuyến nghị) —
          kết quả chỉ để demo luồng, KHÔNG phản ánh đúng chất lượng model thật.
        </div>`;
      }

      if ((data.pool_stats.old || 0) === 0) {
        warnSlot.innerHTML += `<div class="warn">
          ℹ️ Kho <b>old</b> đang rỗng — mọi kết quả "TRÙNG" bên dưới (nếu có) chỉ đang so
          với các ảnh <b>new</b> đã xử lý trước đó trong CÙNG lượt quét này (đúng cơ chế
          pool tăng dần), KHÔNG phải so với kho ảnh cũ thật. Mỗi dòng match giờ có nhãn
          nguồn (kho cũ / ảnh new) để phân biệt rõ.
        </div>`;
      }
    }

    function setStatus(text) {
      document.getElementById("status-line").textContent = text;
    }

    async function runIngest() {
      const btn = document.getElementById("btn-ingest");
      btn.disabled = true;
      setStatus("Đang ingest data/old ...");
      try {
        const res = await fetch("/admin/ingest-old", { method: "POST" });
        const data = await res.json();
        document.getElementById("ingest-result").innerHTML = `<div class="panel">
          <b>Ingest xong</b> (${data.elapsed_ms} ms) —
          thêm mới: ${data.added_count} (${data.added.join(", ") || "-"}),
          bỏ qua (đã có): ${data.skipped_count}
        </div>`;
        setStatus("");
        await refreshStats();
      } catch (err) {
        setStatus("Lỗi ingest: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function pct(x) { return Math.round(x * 1000) / 10; }

    function sourceLabel(source) {
      if (source === "old") return `<span class="src-badge src-old">KHO CŨ (old)</span>`;
      return `<span class="src-badge src-new">ẢNH NEW xử lý trước đó</span>`;
    }

    function renderMatchRow(m) {
      return `<div class="match-row">
        <img src="/admin/image/${m.matched_image_id}" />
        <div class="grow">
          ${m.matched_file_name} ${sourceLabel(m.matched_source)}
          <span class="badge ${m.classification}">${m.classification}</span>
        </div>
        <div>sim=${m.visual_similarity} · pHash=${m.phash_distance} · ssim=${m.ssim} · ΔE=${m.color_delta_e}</div>
      </div>`;
    }

    function renderResultCard(r) {
      if (r.skipped) {
        return `<div class="card"><span class="skipped">${r.file_name}: ${r.reason}</span></div>`;
      }
      // Trong phần chi tiết chỉ hiện match TRÙNG — match KHÔNG TRÙNG không
      // cần xem, chỉ gây nhiễu (đã biết overall là TRÙNG rồi).
      const dupMatches = (r.matches || []).filter(m => m.classification === "TRUNG");
      const matchesHtml = dupMatches.map(renderMatchRow).join("") ||
        `<div class="skipped">Pool đang rỗng — chưa có gì để so sánh.</div>`;
      const cardId = "matches-" + r.image_id;
      return `<div class="card">
        <div class="card-head" onclick="document.getElementById('${cardId}').classList.toggle('open')">
          <img src="/admin/image/${r.image_id}" />
          <div class="name">${r.file_name}<span class="toggle-hint">(bấm để xem chi tiết match)</span></div>
          <div class="verdict">
            <span class="badge ${r.is_duplicate ? 'TRUNG' : 'KHONG_TRUNG'}">${r.is_duplicate ? 'TRÙNG' : 'KHÔNG TRÙNG'}</span>
          </div>
        </div>
        <div class="matches" id="${cardId}">${matchesHtml}</div>
      </div>`;
    }

    async function runScan() {
      const btn = document.getElementById("btn-scan");
      btn.disabled = true;
      setStatus("Đang quét data/new tuần tự ...");
      document.getElementById("scan-results").innerHTML = "";
      try {
        const res = await fetch("/admin/scan-new", { method: "POST" });
        const data = await res.json();
        setStatus(`Xong (${data.elapsed_ms} ms) — xử lý ${data.processed_count}, bỏ qua ${data.skipped_count}`);

        // Chỉ hiện card chi tiết cho ảnh TRÙNG (+ ảnh bị skip vì đã xử lý
        // trước đó). Ảnh KHÔNG TRÙNG không hiện card, chỉ cộng vào 1 dòng
        // tổng kết cho gọn danh sách.
        const nonDupCount = data.results.filter(r => !r.skipped && !r.is_duplicate).length;
        const shown = data.results.filter(r => r.skipped || r.is_duplicate);
        const summary = nonDupCount > 0
          ? `<div class="skipped" style="margin-bottom:10px;">${nonDupCount} ảnh KHÔNG TRÙNG — không hiện chi tiết.</div>`
          : "";
        document.getElementById("scan-results").innerHTML =
          `<div class="panel">${summary}${shown.map(renderResultCard).join("")}</div>`;
        await refreshStats();
      } catch (err) {
        setStatus("Lỗi quét: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function runReset() {
      if (!confirm("Xoá TOÀN BỘ dữ liệu trong DB (không đụng file ảnh gốc)? Không hoàn tác được.")) return;
      await fetch("/admin/reset", { method: "POST" });
      document.getElementById("ingest-result").innerHTML = "";
      document.getElementById("scan-results").innerHTML = "";
      setStatus("Đã reset DB.");
      await refreshStats();
    }

    document.getElementById("btn-ingest").addEventListener("click", runIngest);
    document.getElementById("btn-scan").addEventListener("click", runScan);
    document.getElementById("btn-reset").addEventListener("click", runReset);
    document.getElementById("btn-refresh-stats").addEventListener("click", refreshStats);

    refreshStats();
  </script>
</body>
</html>
