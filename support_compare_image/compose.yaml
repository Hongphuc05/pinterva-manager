# Local Support stack: SSH tunnel to the production Postgres + DINOv2 worker + review UI.
#
#   cd support_compare_image && docker compose up -d
#   open http://127.0.0.1:8000/
#
# Needs .env.local-worker (DATABASE_URL uses 127.0.0.1:15432, exactly as for the manual run;
# worker and review share the tunnel's network namespace, so it resolves to the tunnel).
name: dup-compare-local

x-app: &app
  image: dup-compare-local:latest
  env_file: .env.local-worker
  working_dir: /app/dup-compare
  volumes:
    - ./dup-compare:/app/dup-compare:ro
    - hf-cache:/models
  restart: unless-stopped
  network_mode: "service:tunnel"
  depends_on:
    - tunnel

services:
  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: dup-compare-local:latest
    # Only the key and known_hosts are mounted (not the whole ~/.ssh, whose config
    # may hold macOS-only options). The key must have no passphrase.
    volumes:
      - ${SSH_KEY:-~/.ssh/id_ed25519}:/root/.ssh/id_key:ro
      - ${SSH_KNOWN_HOSTS:-~/.ssh/known_hosts}:/root/.ssh/known_hosts:ro
    command: >
      ssh -N -F /dev/null -i /root/.ssh/id_key -o IdentitiesOnly=yes
      -o UserKnownHostsFile=/root/.ssh/known_hosts -o BatchMode=yes
      -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3
      -L 127.0.0.1:15432:127.0.0.1:5432 ${TUNNEL_SSH:-tacahu@221.132.19.222}
    # Published here because review shares this container's network.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    <<: *app
    command: python local_worker.py

  review:
    <<: *app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  hf-cache:
