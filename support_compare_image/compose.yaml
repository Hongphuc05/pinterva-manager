# Support machine: the compute agent. It talks to the Tacahu API over HTTPS only (no SSH tunnel,
# no database access) and computes only while a signed-in Support allows this machine on the web.
#
#   cp .env.agent.example .env.agent      # set SUPPORT_API_URL / SUPPORT_WEB_URL / AGENT_NAME
#   docker compose up -d --build          # runs in the background and restarts with Docker
#   # then just log in on the web from this machine: it asks "Cho phép dùng máy này?" -> Có
#
# The agent listens on 127.0.0.1:8765 only, for the web page open on this same machine.
#
# 1-1 compare tool (optional):  docker compose --profile tools up -d compare  -> http://127.0.0.1:8000
name: dup-compare-local

x-app: &app
  image: dup-compare-local:latest
  build:
    context: .
    dockerfile: Dockerfile.local
  working_dir: /app/dup-compare
  volumes:
    - ./dup-compare:/app/dup-compare:ro
    - hf-cache:/models

services:
  agent:
    <<: *app
    env_file: .env.agent
    environment:
      AGENT_BIND: 0.0.0.0   # inside the container; the port below is published on localhost only
    ports:
      - "127.0.0.1:8765:8765"
    command: python agent.py
    restart: unless-stopped

  compare:
    <<: *app
    profiles: ["tools"]
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  hf-cache:
