name: tacahu-ops

x-backend: &backend
  build:
    context: ${APP_SOURCE_DIR:-.}
    dockerfile: Dockerfile
    # The production host runs Docker inside WSL2.  Its bridge DNS may not be
    # able to resolve PyPI after a Windows network change, while the host DNS
    # can.  Use the host network only while building the image.
    network: host
  image: ${BACKEND_IMAGE:-tacahu-backend}:${APP_VERSION:-latest}
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped
  environment:
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    PLAYWRIGHT_BROWSER_CHANNEL: ""
    PLAYWRIGHT_PROFILE_ROOT: /app/chrome-profiles
    PLAYWRIGHT_EVIDENCE_DIR: /app/playwright-evidence
  volumes:
    - ${DATA_DIR:-./data}/crawled_assets:/app/crawled_assets
    - ${DATA_DIR:-./data}/order_assets:/app/order_assets
    - ${DATA_DIR:-./data}/platform_data:/app/platform_data
    - ${DATA_DIR:-./data}/playwright_evidence:/app/playwright-evidence
    - ${DATA_DIR:-./data}/chrome_profiles:/app/chrome-profiles
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  api:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  celery-general:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "celery", "-n", "general@%h"]
    depends_on:
      redis:
        condition: service_healthy

  celery-assignment:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool=solo", "--loglevel=info", "-Q", "assignment", "-n", "assignment@%h"]
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    profiles: ["migration"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
