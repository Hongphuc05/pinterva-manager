name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

# Keep deployments serial: GitHub replaces an obsolete pending run with the latest
# commit, but never interrupts a live Docker build or database migration.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinterval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pinterval_test
      SECRET_KEY: ci-test-secret
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync code to /srv/tacahu and restart containers
        run: |
          set -euo pipefail
          cp compose.yaml /srv/tacahu/compose.yaml
          cp Dockerfile /srv/tacahu/Dockerfile
          cp pyproject.toml /srv/tacahu/pyproject.toml
          cp alembic.ini /srv/tacahu/alembic.ini
          rsync -a --delete migrations/ /srv/tacahu/migrations/
          rsync -a --delete app/ /srv/tacahu/app/
          cd /srv/tacahu
          docker compose build api celery-general celery-assignment celery-beat
          docker compose run --rm migrate
          docker compose up -d --force-recreate api celery-general celery-assignment celery-beat
          docker compose ps
