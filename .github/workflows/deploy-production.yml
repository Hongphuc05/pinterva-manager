name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: tacahu-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            cd /srv/tacahu-ops/pinterva-manager

            echo "=== Fetching main ==="
            git fetch origin main

            echo "=== Updating production source ==="
            git checkout main
            git reset --hard origin/main

            echo "=== Current commit ==="
            git log -1 --oneline

            VERSION=$(git rev-parse --short HEAD)
            echo "Deploying version: $VERSION"

            if grep -q '^APP_VERSION=' .env.production; then
              sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" .env.production
            else
              echo "APP_VERSION=$VERSION" >> .env.production
            fi

            echo "=== Preparing persistent work-note attachments ==="
            DATA_DIR=$(awk -F= '$1 == "DATA_DIR" { sub(/^[^=]*=/, ""); print; exit }' .env.production)
            WORK_NOTE_ASSETS_DIR="$DATA_DIR/private_work_note_assets"
            mkdir -p "$WORK_NOTE_ASSETS_DIR"

            # The API image runs as UID/GID 10001. Bootstrap the new host mount with the
            # currently running trusted API image before the new compose config recreates it.
            CURRENT_API_CONTAINER=$(docker compose --env-file .env.production -f compose.production.yaml ps -q api)
            if [ -z "$CURRENT_API_CONTAINER" ]; then
              echo "Cannot bootstrap work-note attachment permissions: API container is not running." >&2
              exit 1
            fi
            CURRENT_API_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CURRENT_API_CONTAINER")
            docker run --rm --user 0:0 \
              -v "$WORK_NOTE_ASSETS_DIR:/assets" \
              --entrypoint chown \
              "$CURRENT_API_IMAGE" \
              -R 10001:10001 /assets

            echo "=== Preflight ==="
            ./scripts/production-preflight.sh --with-tunnel

            echo "=== Deploy ==="
            ./scripts/deploy-production.sh --build --with-tunnel

            echo "=== Container status ==="
            docker compose \
              --env-file .env.production \
              -f compose.production.yaml \
              ps

            echo "=== Health check ==="
            curl --fail --silent \
              http://127.0.0.1:8000/api/health

            echo
            echo "=== Production deploy successful ==="
          EOF
