name: tacahu-ops-production

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.production
  image: tacahu-ops:${APP_VERSION:-local}
  env_file: ${ENV_FILE:-.env.production}
  restart: unless-stopped
  environment:
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    PLAYWRIGHT_BROWSER_CHANNEL: ""
    PLAYWRIGHT_PROFILE_ROOT: /app/chrome-profiles
    PLAYWRIGHT_EVIDENCE_DIR: /app/playwright-evidence
  volumes:
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/crawled_assets:/app/crawled_assets
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/order_assets:/app/order_assets
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/private_work_note_assets:/app/private_work_note_assets
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/platform_data:/app/platform_data
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/playwright_evidence:/app/playwright-evidence
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/chrome_profiles:/app/chrome-profiles
    - ${DATA_DIR:?Set DATA_DIR in .env.production}/huggingface_cache:/home/app/.cache/huggingface
    # The service-account JSON lives outside Git/image. When reporting is disabled,
    # /dev/null is mounted and the application never attempts to read it.
    - ${GOOGLE_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:${GOOGLE_SERVICE_ACCOUNT_FILE:-/run/secrets/google-service-account.json}:ro
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env.production}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env.production}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-lc", "alembic upgrade head && cd /app/support_compare_image && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migration"]

  api:
    <<: *backend
    # Localhost-only access keeps the API private; Cloudflare Tunnel reaches api:8000
    # through the internal Compose network.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  celery-general:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "celery", "-n", "general@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-assignment:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool=solo", "--loglevel=info", "-Q", "assignment", "-n", "assignment@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-compare:
    <<: *backend
    # Keep the model resident in one dedicated worker.  It is deliberately
    # solo/serialized until GPU sizing and batch throughput are measured.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool=solo", "--loglevel=info", "-Q", "support-compare", "-n", "compare@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
