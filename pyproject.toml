[project]
name = "pinterval-ops"
version = "0.1.0"
description = "Web dashboard van hanh noi bo - Pinterval outsource team"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "bcrypt>=4.1",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates one `sa.Column(...)` per line and cannot wrap them; a
# timestamptz column declaration alone exceeds 100 chars. Hand-wrapping generated
# output would just regress on the next `alembic revision --autogenerate`.
"migrations/versions/*" = ["E501"]
